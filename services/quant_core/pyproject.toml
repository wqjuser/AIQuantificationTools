[project]
name = "quant-core"
version = "0.1.0"
description = "Local and multi-tenant quant research core for AIQuantificationTools"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "authlib>=1.3,<2",
  "cryptography>=42",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.41,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
data = ["akshare", "yfinance", "ccxt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
