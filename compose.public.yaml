services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiqt
      POSTGRES_USER: aiqt
      POSTGRES_PASSWORD: ${AIQT_POSTGRES_PASSWORD:?set AIQT_POSTGRES_PASSWORD}
    volumes:
      - quant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqt -d aiqt"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AIQT_KEYCLOAK_DATABASE_PASSWORD:?set AIQT_KEYCLOAK_DATABASE_PASSWORD}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-schema:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${AIQT_KEYCLOAK_DATABASE_PASSWORD:?set AIQT_KEYCLOAK_DATABASE_PASSWORD}
    command:
      - psql
      - --host=keycloak-postgres
      - --username=keycloak
      - --dbname=keycloak
      - --set=ON_ERROR_STOP=1
      - --command=CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: unless-stopped
    depends_on:
      keycloak-schema:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AIQT_KEYCLOAK_DATABASE_PASSWORD:?set AIQT_KEYCLOAK_DATABASE_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HOSTNAME: ${AIQT_AUTH_ORIGIN:?set AIQT_AUTH_ORIGIN}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      AIQT_PUBLIC_ORIGIN: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}
      AIQT_KEYCLOAK_WEB_CLIENT_SECRET: ${AIQT_KEYCLOAK_WEB_CLIENT_SECRET:?set AIQT_KEYCLOAK_WEB_CLIENT_SECRET}
      AIQT_KEYCLOAK_SMTP_HOST: ${AIQT_KEYCLOAK_SMTP_HOST:?set AIQT_KEYCLOAK_SMTP_HOST}
      AIQT_KEYCLOAK_SMTP_PORT: ${AIQT_KEYCLOAK_SMTP_PORT:?set AIQT_KEYCLOAK_SMTP_PORT}
      AIQT_KEYCLOAK_SMTP_FROM: ${AIQT_KEYCLOAK_SMTP_FROM:?set AIQT_KEYCLOAK_SMTP_FROM}
      AIQT_KEYCLOAK_SMTP_USERNAME: ${AIQT_KEYCLOAK_SMTP_USERNAME:?set AIQT_KEYCLOAK_SMTP_USERNAME}
      AIQT_KEYCLOAK_SMTP_PASSWORD: ${AIQT_KEYCLOAK_SMTP_PASSWORD:?set AIQT_KEYCLOAK_SMTP_PASSWORD}
      AIQT_KEYCLOAK_SMTP_TLS_MODE: ${AIQT_KEYCLOAK_SMTP_TLS_MODE:?set AIQT_KEYCLOAK_SMTP_TLS_MODE}
      AIQT_KEYCLOAK_GOOGLE_CLIENT_ID: ${AIQT_KEYCLOAK_GOOGLE_CLIENT_ID:?set AIQT_KEYCLOAK_GOOGLE_CLIENT_ID}
      AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET: ${AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET:?set AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${AIQT_KEYCLOAK_SMTP_TLS_MODE}" in
          starttls) export AIQT_KEYCLOAK_SMTP_STARTTLS=true AIQT_KEYCLOAK_SMTP_SSL=false ;;
          ssl) export AIQT_KEYCLOAK_SMTP_STARTTLS=false AIQT_KEYCLOAK_SMTP_SSL=true ;;
          *) echo "AIQT_KEYCLOAK_SMTP_TLS_MODE must be starttls or ssl" >&2; exit 2 ;;
        esac
        exec /opt/keycloak/bin/kc.sh start --features=cimd --import-realm
    expose:
      - "8080"
    volumes:
      - ./deploy/keycloak/realm-aiqt.json:/opt/keycloak/data/import/aiqt-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIQT_DATABASE_URL: ${AIQT_DATABASE_URL:?set AIQT_DATABASE_URL}
    command: ["alembic", "-c", "services/quant_core/alembic.ini", "upgrade", "head"]

  keycloak-config:
    profiles: ["keycloak-admin"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    environment:
      AIQT_PUBLIC_ORIGIN: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}
      AIQT_KEYCLOAK_SMTP_HOST: ${AIQT_KEYCLOAK_SMTP_HOST:?set AIQT_KEYCLOAK_SMTP_HOST}
      AIQT_KEYCLOAK_SMTP_PORT: ${AIQT_KEYCLOAK_SMTP_PORT:?set AIQT_KEYCLOAK_SMTP_PORT}
      AIQT_KEYCLOAK_SMTP_FROM: ${AIQT_KEYCLOAK_SMTP_FROM:?set AIQT_KEYCLOAK_SMTP_FROM}
      AIQT_KEYCLOAK_SMTP_USERNAME: ${AIQT_KEYCLOAK_SMTP_USERNAME:?set AIQT_KEYCLOAK_SMTP_USERNAME}
      AIQT_KEYCLOAK_SMTP_PASSWORD: ${AIQT_KEYCLOAK_SMTP_PASSWORD:?set AIQT_KEYCLOAK_SMTP_PASSWORD}
      AIQT_KEYCLOAK_SMTP_TLS_MODE: ${AIQT_KEYCLOAK_SMTP_TLS_MODE:?set AIQT_KEYCLOAK_SMTP_TLS_MODE}
      AIQT_KEYCLOAK_GOOGLE_CLIENT_ID: ${AIQT_KEYCLOAK_GOOGLE_CLIENT_ID:?set AIQT_KEYCLOAK_GOOGLE_CLIENT_ID}
      AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET: ${AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET:?set AIQT_KEYCLOAK_GOOGLE_CLIENT_SECRET}

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      AIQT_DEPLOYMENT_MODE: public
      AIQT_DATABASE_URL: ${AIQT_DATABASE_URL:?set AIQT_DATABASE_URL}
      AIQT_PUBLIC_ORIGIN: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}
      AIQT_OIDC_ISSUER: ${AIQT_AUTH_ORIGIN:?set AIQT_AUTH_ORIGIN}/realms/aiqt
      AIQT_OIDC_CLIENT_ID: aiqt-web
      AIQT_OIDC_CLIENT_SECRET: ${AIQT_KEYCLOAK_WEB_CLIENT_SECRET:?set AIQT_KEYCLOAK_WEB_CLIENT_SECRET}
      AIQT_SETTINGS_MASTER_KEY: ${AIQT_SETTINGS_MASTER_KEY:?set AIQT_SETTINGS_MASTER_KEY}
      AIQT_OUTBOUND_ORIGIN_ALLOWLIST: ${AIQT_OUTBOUND_ORIGIN_ALLOWLIST:-}
      AIQT_CLAUDE_CONNECT_ENABLED: ${AIQT_CLAUDE_CONNECT_ENABLED:-false}
      AIQT_TRUSTED_PROXY_IPS: "*"
      OPENAI_API_KEY: ""
      OPENAI_COMPATIBLE_API_KEY: ""
      CCXT_SANDBOX_API_KEY: ""
      CCXT_SANDBOX_SECRET: ""
      CCXT_PRODUCTION_READONLY_API_KEY: ""
      CCXT_PRODUCTION_READONLY_SECRET: ""
      CCXT_PRODUCTION_TRADING_API_KEY: ""
      CCXT_PRODUCTION_TRADING_SECRET: ""
      AIQT_ENABLE_PRODUCTION_TRADING: "false"

  web:
    ports: !reset []

  mcp:
    profiles: !reset []
    depends_on:
      api:
        condition: service_healthy
    environment: !override
      AIQT_DEPLOYMENT_MODE: public
      AIQT_DATABASE_URL: ${AIQT_DATABASE_URL:?set AIQT_DATABASE_URL}
      AIQT_PUBLIC_ORIGIN: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}
      AIQT_OIDC_ISSUER: ${AIQT_AUTH_ORIGIN:?set AIQT_AUTH_ORIGIN}/realms/aiqt
      AIQT_MCP_TRANSPORT: streamable-http
      AIQT_MCP_HOST: 0.0.0.0
      AIQT_MCP_ALLOW_NON_LOOPBACK_HTTP: "true"
      AIQT_MCP_PORT: "8766"
      AIQT_MCP_PUBLIC_RESOURCE_URL: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}/mcp
      AIQT_MCP_ENABLE_RESEARCH_WRITES: "false"
      AIQT_MCP_RATE_LIMIT_REQUESTS_1M: ${AIQT_MCP_RATE_LIMIT_REQUESTS_1M:-120}
      AIQT_MCP_REQUEST_TIMEOUT_SECONDS: ${AIQT_MCP_REQUEST_TIMEOUT_SECONDS:-600}
    ports: !reset []
    expose:
      - "8766"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mcp:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      AIQT_PUBLIC_ORIGIN: ${AIQT_PUBLIC_ORIGIN:?set AIQT_PUBLIC_ORIGIN}
      AIQT_AUTH_ORIGIN: ${AIQT_AUTH_ORIGIN:?set AIQT_AUTH_ORIGIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  quant-postgres:
  keycloak-postgres:
  caddy-data:
  caddy-config:
